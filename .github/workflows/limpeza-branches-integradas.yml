name: Limpeza auditada e pontual das branches frontend
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: read
jobs:
  limpar:
    if: "${{ startsWith(github.event.head_commit.message, 'chore(branches): limpeza auditada do frontend') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Excluir somente branches antigas verificadas
        uses: actions/github-script@v7
        with:
          script: |
            const expected = {
              "codex/clientes-mascaras-cpf": "c0db178d6d3a6921d6f725ccdea585940853d9f8",
              "codex/organizacoes-areas": "cf95595052d0b71f0fe4eb539ac0e6183121ae9e",
              "codex/usuarios-e-permissoes": "0deabaa37bbb96691656a9ce5b36cbf48b979371",
              "review/ci-admin-main-frontend-20261122": "14ba1af20a87848f8c099eea04d6807a6bb9e00f",
              "review/cpf-mascaras-isolado-20261121": "cd9a9aea736009176dc66838e93828e9be99d235",
              "review/financeiro-exportacao-csv-20261122": "7e2024dd9a588306b5df5192dc5ac8a9119d02f8",
              "review/financeiro-painel-20261122": "912d85ba6573a29ee8d8fa7bc3cbc0d969fee92f",
              "review/organizacoes-usuarios-20261122": "cddefa6a3bbcb4dca2ee505199e7300f9cc3927a",
              "review/prontuario-fisioterapia-rascunhos-20261122": "531daa793e485b7cecbeff7af18a503eaa686ca4",
              "review/security-e2e-isolado-20261122": "0d93f06b0d54f5467bce7171110c2b9acc285430",
              "review/whatsapp-isolado-20261121": "b0b51521c57717d45cb16874ed4319687883c984",
              "review/whatsapp-e2e-recuperado-20261122": "f9d8cd78b8190afa91f8abc16da25fb761a3aab9"
            };
            const { owner, repo } = context.repo;
            const protectedNames = new Set(['main','codex/infinitepay-integration']);
            const selfBranch = 'review/limpeza-branches-frontend-20261122';
            const pulls = (await github.rest.pulls.list({
              owner, repo, state: 'closed', per_page: 100
            })).data;
            const self = pulls.find(p =>
              p.head.ref === selfBranch && p.merged_at && p.merge_commit_sha === context.sha
            );
            if (self) expected[selfBranch] = self.head.sha;
            let removed = 0;
            const failures = [];
            for (const [name, sha] of Object.entries(expected)) {
              if (protectedNames.has(name) || !/^(codex|review)\/[a-z0-9_\/-]+$/.test(name)) {
                failures.push(name + ': branch protegida/não autorizada');
                continue;
              }
              try {
                const current = await github.rest.git.getRef({ owner, repo, ref: 'heads/' + name });
                if (current.data.object.sha !== sha) {
                  failures.push(name + ': SHA alterado desde a auditoria');
                  continue;
                }
                const opened = (await github.rest.pulls.list({
                  owner, repo, state: 'open', head: owner + ':' + name, per_page: 5,
                })).data;
                if (opened.length) {
                  failures.push(name + ': pull request aberto');
                  continue;
                }
                await github.rest.git.deleteRef({ owner, repo, ref: 'heads/' + name });
                core.info('Excluída branch confirmada: ' + name);
                removed++;
              } catch (error) {
                if (error.status === 404) core.info(name + ': já excluída');
                else failures.push(name + ': exclusão recusada (' + (error.status || 'erro') + ')');
              }
            }
            core.info('Branches efetivamente removidas: ' + removed);
            for (const f of failures) core.warning(f);
            if (failures.length) core.setFailed(failures.length + ' branches não removidas.');
