name: Prontuario PostgreSQL - frontend de homologacao
on:
  push:
    branches:
      - feat/prontuario-workspace-postgres-20261125
  pull_request:
    branches:
      - feat/prontuario-area-profissional-integracao-20261123
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
